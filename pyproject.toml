[build-system]
requires = ["poetry-core>=1.2.0", "wheel"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "drl-navigation-ros2"
version = "0.2.0"
description = "V550 Ackermann autonomous navigation with TD3, ROS 2 Nav2, and Gazebo."
authors = ["Jacob_Tan"]
maintainers = ["Jacob_Tan"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Jacob-Tan666/V550-Ackermann-DRL-Nav2"
repository = "https://github.com/Jacob-Tan666/V550-Ackermann-DRL-Nav2"
packages = [{ include = "drl_navigation_ros2", from = "src" }]
include = ["LICENSE"]
keywords = [
    "v550 ackermann",
    "ros2 humble",
    "nav2",
    "autonomous navigation",
    "deep reinforcement learning",
    "td3",
    "gazebo",
    "robot navigation",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
catkin-pkg = "^1.0.0"
empy = "3.3.4"
lark = "^1.1.9"
numpy = "^1.24"
squaternion = "^2023.9.2"
tensorboard = "^2.17.0"
torch = "^2.3.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.10.0"

[tool.poetry.group.linters]
optional = true

[tool.poetry.group.linters.dependencies]
ruff = "^0.4.2"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"

[tool.poetry.urls]
Tracker = "https://github.com/Jacob-Tan666/V550-Ackermann-DRL-Nav2/issues"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/drl_navigation_ros2"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
