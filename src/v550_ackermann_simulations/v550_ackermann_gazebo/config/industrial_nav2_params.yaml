amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # Gazebo odometry is ground truth in this launch. Keep AMCL for pose
    # estimation diagnostics, but do not let scan-matching drift move Nav2 TF.
    tf_broadcast: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 0.5
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.12
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Match the controller's 3 cm position tolerance. This condition is checked
    # every BT tick and stops replanning as soon as the position is reached.
    goal_reached_tol: 0.03
    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - v550_goal_orientation_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: odom
    speed_limit_topic: speed_limit
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 45.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      # Stop on the first precise position arrival. Final heading is generated
      # from the feasible approach path instead of enforced after arrival.
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 3.14159265359

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 45
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      vx_std: 0.24
      vy_std: 0.0
      wz_std: 0.45
      vx_max: 0.70
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.90
      prune_distance: 2.0
      transform_tolerance: 0.20
      temperature: 0.30
      gamma: 0.015
      motion_model: Ackermann
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      AckermannConstraints:
        # Planner, controller and steering adapter share this feasible radius.
        min_turning_r: 0.45
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.2
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.35
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.50
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.40
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0
        max_path_occupancy_ratio: 0.12
        trajectory_point_step: 2
        threshold_to_consider: 0.40
        offset_from_furthest: 14
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        offset_from_furthest: 5
        threshold_to_consider: 1.50
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.40
        max_angle_to_furthest: 0.90
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.40

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 12.0
      publish_frequency: 6.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 9
      height: 9
      resolution: 0.05
      footprint: "[[0.18, 0.11], [0.18, -0.11], [-0.16, -0.11], [-0.16, 0.11]]"
      footprint_padding: 0.025
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan predicted_dynamic_obstacles
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          observation_persistence: 0.35
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 9.0
          obstacle_min_range: 0.12
        predicted_dynamic_obstacles:
          topic: predicted_dynamic_obstacles
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          marking: true
          clearing: false
          data_type: PointCloud2
          observation_persistence: 0.15
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 6.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.18, 0.11], [0.18, -0.11], [-0.16, -0.11], [-0.16, 0.11]]"
      footprint_padding: 0.025
      resolution: 0.05
      track_unknown_space: false
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan predicted_dynamic_obstacles
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          observation_persistence: 0.35
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 9.0
          obstacle_min_range: 0.12
        predicted_dynamic_obstacles:
          topic: predicted_dynamic_obstacles
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          marking: true
          clearing: false
          data_type: PointCloud2
          observation_persistence: 0.15
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased, GoalHeadingGuide]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.01
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1500
      max_planning_time: 5.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      minimum_turning_radius: 0.45
      reverse_penalty: 1.6
      change_penalty: 0.05
      non_straight_penalty: 1.15
      cost_penalty: 2.4
      retrospective_penalty: 0.015
      lookup_table_size: 30.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2
    GoalHeadingGuide:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.01
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: MOORE
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [backup, wait]
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.5
    max_rotational_vel: 0.45
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 30.0
    scale_velocities: true
    # Ackermann steering cannot track angular.z like a differential drive.
    # Open-loop smoothing avoids reducing linear speed to match that feedback.
    feedback: OPEN_LOOP
    max_velocity: [0.72, 0.0, 1.90]
    min_velocity: [0.0, 0.0, -1.90]
    max_accel: [1.50, 0.0, 2.50]
    max_decel: [-2.00, 0.0, -3.00]
    odom_topic: odom
    odom_duration: 0.25
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
