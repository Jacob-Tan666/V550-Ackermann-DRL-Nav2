<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">V550 Ackermann autonomous navigation system architecture</title>
  <desc id="desc">A shared Gazebo V550 digital twin connects a TD3 learning loop, an industrial Nav2 autonomy pipeline, observability tools, and an Ackermann actuation gateway.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#c7d2df" stroke-width="1" opacity="0.62"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.13"/>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85f00"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16803a"/>
    </marker>
    <clipPath id="robotClip">
      <rect x="840" y="146" width="184" height="128" rx="7"/>
    </clipPath>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #10243e; letter-spacing: 0; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #56677a; letter-spacing: 0; }
      .eyebrow { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .section { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #16243a; letter-spacing: 0; }
      .nodeTitle { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1a2b42; letter-spacing: 0; }
      .nodeText { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #56677a; letter-spacing: 0; }
      .small { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #607188; letter-spacing: 0; }
      .flowLabel { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; paint-order: stroke fill; stroke: #f3f6fa; stroke-width: 6px; stroke-linejoin: round; }
      .panel { fill: #ffffff; stroke: #c5d1dd; stroke-width: 1.5; }
      .node { fill: #f8fafc; stroke: #c5d1dd; stroke-width: 1.25; }
      .cyanLine { fill: none; stroke: #087f8c; stroke-width: 2.5; marker-end: url(#arrowCyan); }
      .amberLine { fill: none; stroke: #b85f00; stroke-width: 2.5; marker-end: url(#arrowAmber); }
      .greenLine { fill: none; stroke: #16803a; stroke-width: 2.5; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#f3f6fa"/>
  <rect width="1600" height="940" fill="url(#grid)"/>
  <rect x="1" y="1" width="1598" height="938" rx="8" fill="none" stroke="#c5d1dd" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(40 32)">
    <rect x="0" y="2" width="5" height="65" rx="2" fill="#16803a"/>
    <text x="23" y="30" class="title">V550 ACKERMANN AUTONOMY STACK</text>
    <text x="23" y="56" class="subtitle">Deep reinforcement learning and ROS 2 Nav2 on a shared Gazebo digital twin</text>
  </g>

  <g transform="translate(1042 38)">
    <rect x="0" y="0" width="116" height="32" rx="8" fill="#e8f6f7" stroke="#9dcfd4"/>
    <text x="58" y="21" class="small" text-anchor="middle" fill="#087f8c">165-D STATE</text>
    <rect x="126" y="0" width="108" height="32" rx="8" fill="#e8f6f7" stroke="#9dcfd4"/>
    <text x="180" y="21" class="small" text-anchor="middle" fill="#087f8c">2-D ACTION</text>
    <rect x="244" y="0" width="128" height="32" rx="8" fill="#fff3e3" stroke="#e2ba80"/>
    <text x="308" y="21" class="small" text-anchor="middle" fill="#b85f00">HYBRID-A*</text>
    <rect x="382" y="0" width="98" height="32" rx="8" fill="#fff3e3" stroke="#e2ba80"/>
    <text x="431" y="21" class="small" text-anchor="middle" fill="#b85f00">MPPI</text>
  </g>

  <!-- Shared simulation spine -->
  <g filter="url(#shadow)">
    <rect x="40" y="142" width="400" height="136" rx="8" class="panel"/>
    <rect x="40" y="142" width="6" height="136" rx="3" fill="#9b2fb3"/>
    <text x="68" y="169" class="eyebrow" fill="#9b2fb3">SIMULATED WORLD</text>
    <text x="68" y="201" class="section">Industrial Warehouse</text>
    <text x="68" y="226" class="nodeText">Gazebo Classic &#8226; static map &#8226; physics</text>
    <text x="68" y="248" class="nodeText">forklifts &#8226; AGV &#8226; worker &#8226; randomized goals</text>

    <rect x="560" y="132" width="480" height="156" rx="8" fill="#f0faf3" stroke="#7fbd93" stroke-width="2"/>
    <rect x="560" y="132" width="480" height="5" rx="2" fill="#16803a"/>
    <text x="585" y="162" class="eyebrow" fill="#16803a">SHARED DIGITAL TWIN</text>
    <text x="585" y="192" class="section">WHEELTEC V550</text>
    <text x="585" y="217" class="nodeText">Ackermann kinematics &#8226; rear-wheel drive</text>
    <text x="585" y="239" class="nodeText">LaserScan &#8226; odometry &#8226; TF</text>
    <rect x="585" y="254" width="203" height="22" rx="8" fill="#ddf2e4"/>
    <text x="686" y="269" class="small" text-anchor="middle" fill="#16803a">0.45 m TURNING RADIUS</text>
    <rect x="838" y="144" width="188" height="132" rx="8" fill="#ffffff" stroke="#66a87d" stroke-width="1.5"/>

    <!-- Native SVG artwork keeps the V550 visible under GitHub's image policy. -->
    <g clip-path="url(#robotClip)">
      <rect x="840" y="146" width="184" height="128" fill="#eef3f6"/>
      <path d="M 840 172 L 1024 172 M 840 210 L 1024 210 M 840 248 L 1024 248" stroke="#d5dee8" stroke-width="1"/>
      <path d="M 872 146 L 872 274 M 932 146 L 932 274 M 992 146 L 992 274" stroke="#d5dee8" stroke-width="1"/>
      <ellipse cx="932" cy="247" rx="62" ry="13" fill="#8ca0b5" opacity="0.22"/>
      <g transform="translate(932 209) rotate(-8)">
        <rect x="-49" y="-31" width="19" height="18" rx="5" fill="#18283b"/>
        <rect x="30" y="-31" width="19" height="18" rx="5" fill="#18283b"/>
        <rect x="-49" y="13" width="19" height="18" rx="5" fill="#18283b"/>
        <rect x="30" y="13" width="19" height="18" rx="5" fill="#18283b"/>
        <path d="M -38 -27 L 31 -27 L 43 -15 L 43 15 L 31 27 L -38 27 L -44 16 L -44 -16 Z" fill="#263d58" stroke="#10243e" stroke-width="2"/>
        <rect x="-30" y="-20" width="55" height="40" rx="6" fill="#e9eef3" stroke="#7d91a8" stroke-width="1.5"/>
        <rect x="-21" y="-14" width="37" height="28" rx="4" fill="#16803a"/>
        <path d="M 25 -17 L 38 -11 L 38 11 L 25 17 Z" fill="#087f8c"/>
        <circle cx="-3" cy="0" r="11" fill="#ffffff" stroke="#4959c7" stroke-width="3"/>
        <circle cx="-3" cy="0" r="4" fill="#4959c7"/>
        <path d="M -3 -11 L 14 -24 M -3 -11 L -20 -24" stroke="#4959c7" stroke-width="2" opacity="0.7"/>
      </g>
      <rect x="849" y="253" width="44" height="15" rx="5" fill="#ffffff" stroke="#9fb0c1"/>
      <text x="871" y="264" class="small" text-anchor="middle" fill="#16803a">V550</text>
    </g>
    <image href="v550-robot.jpg" x="840" y="146" width="184" height="128" preserveAspectRatio="xMidYMid slice" clip-path="url(#robotClip)"/>

    <rect x="1160" y="142" width="400" height="136" rx="8" class="panel"/>
    <rect x="1554" y="142" width="6" height="136" rx="3" fill="#4959c7"/>
    <text x="1188" y="169" class="eyebrow" fill="#4959c7">OBSERVABILITY</text>
    <text x="1188" y="201" class="section">Inspect, Measure, Replay</text>
    <text x="1188" y="226" class="nodeText">RViz trajectories &#8226; TensorBoard learning curves</text>
    <text x="1188" y="248" class="nodeText">CSV/JSON metrics &#8226; checkpoints &#8226; best policy</text>
  </g>

  <path d="M 440 210 L 560 210" class="greenLine"/>
  <text x="500" y="197" class="flowLabel" text-anchor="middle" fill="#16803a">world state</text>
  <path d="M 1040 210 L 1160 210" class="greenLine"/>
  <text x="1100" y="197" class="flowLabel" text-anchor="middle" fill="#16803a">telemetry</text>

  <!-- DRL panel -->
  <g filter="url(#shadow)">
    <rect x="40" y="326" width="735" height="450" rx="8" class="panel"/>
    <rect x="40" y="326" width="735" height="5" rx="2" fill="#087f8c"/>
  </g>
  <text x="72" y="367" class="eyebrow" fill="#087f8c">MODE 01 &#8226; LEARN</text>
  <text x="72" y="397" class="section">TD3 closed-loop training</text>
  <text x="742" y="367" class="small" text-anchor="end">single or multi-process Gazebo workers</text>

  <g>
    <rect x="72" y="424" width="205" height="98" rx="8" class="node"/>
    <rect x="72" y="424" width="205" height="4" rx="2" fill="#087f8c"/>
    <text x="92" y="454" class="nodeTitle">State Encoder</text>
    <text x="92" y="478" class="nodeText">3-frame lidar stack</text>
    <text x="92" y="499" class="nodeText">goal + action history</text>

    <rect x="304" y="424" width="205" height="98" rx="8" class="node"/>
    <rect x="304" y="424" width="205" height="4" rx="2" fill="#087f8c"/>
    <text x="324" y="454" class="nodeTitle">Policy Actor</text>
    <text x="324" y="478" class="nodeText">Conv1D + MLP</text>
    <text x="324" y="499" class="nodeText">normalized action [-1, 1]</text>

    <rect x="536" y="424" width="205" height="98" rx="8" class="node"/>
    <rect x="536" y="424" width="205" height="4" rx="2" fill="#087f8c"/>
    <text x="556" y="454" class="nodeTitle">Control Mapping</text>
    <text x="556" y="478" class="nodeText">signed speed</text>
    <text x="556" y="499" class="nodeText">speed-aware steering limit</text>

    <rect x="72" y="588" width="205" height="98" rx="8" class="node"/>
    <rect x="72" y="588" width="205" height="4" rx="2" fill="#9b2fb3"/>
    <text x="92" y="618" class="nodeTitle">Reward + Terminal</text>
    <text x="92" y="642" class="nodeText">progress &#8226; clearance &#8226; smoothness</text>
    <text x="92" y="663" class="nodeText">goal &#8226; collision &#8226; timeout</text>

    <rect x="304" y="588" width="205" height="98" rx="8" class="node"/>
    <rect x="304" y="588" width="205" height="4" rx="2" fill="#9b2fb3"/>
    <text x="324" y="618" class="nodeTitle">Prioritized Replay</text>
    <text x="324" y="642" class="nodeText">TD-error sampling</text>
    <text x="324" y="663" class="nodeText">importance weights</text>

    <rect x="536" y="588" width="205" height="98" rx="8" class="node"/>
    <rect x="536" y="588" width="205" height="4" rx="2" fill="#9b2fb3"/>
    <text x="556" y="618" class="nodeTitle">Twin-Critic Learner</text>
    <text x="556" y="642" class="nodeText">target networks &#8226; soft updates</text>
    <text x="556" y="663" class="nodeText">policy + checkpoint sync</text>
  </g>

  <path d="M 277 473 L 304 473" class="cyanLine"/>
  <path d="M 509 473 L 536 473" class="cyanLine"/>
  <path d="M 174 522 L 174 588" class="cyanLine"/>
  <text x="185" y="557" class="flowLabel" fill="#087f8c">step</text>
  <path d="M 277 637 L 304 637" class="cyanLine"/>
  <path d="M 509 637 L 536 637" class="cyanLine"/>
  <path d="M 638 588 C 638 548 406 560 406 522" class="cyanLine" stroke-dasharray="7 6"/>
  <text x="522" y="550" class="flowLabel" text-anchor="middle" fill="#087f8c">policy update</text>
  <path d="M 685 288 C 640 310 56 298 56 350 L 56 412 L 174 412 L 174 424" class="cyanLine" stroke-dasharray="7 6"/>
  <text x="365" y="313" class="flowLabel" text-anchor="middle" fill="#087f8c">scan + odometry feedback</text>

  <rect x="72" y="719" width="669" height="32" rx="8" fill="#e8f6f7" stroke="#9dcfd4"/>
  <text x="406" y="740" class="small" text-anchor="middle" fill="#087f8c">OU EXPLORATION &#8226; TARGET SMOOTHING &#8226; DOMAIN RANDOMIZATION &#8226; GRADIENT CLIPPING</text>

  <!-- Nav2 panel -->
  <g filter="url(#shadow)">
    <rect x="825" y="326" width="735" height="450" rx="8" class="panel"/>
    <rect x="825" y="326" width="735" height="5" rx="2" fill="#b85f00"/>
  </g>
  <text x="857" y="367" class="eyebrow" fill="#b85f00">MODE 02 &#8226; DEPLOY</text>
  <text x="857" y="397" class="section">Industrial Nav2 autonomy</text>
  <text x="1527" y="367" class="small" text-anchor="end">Ackermann-aware planning and control</text>

  <g>
    <rect x="857" y="424" width="205" height="98" rx="8" class="node"/>
    <rect x="857" y="424" width="205" height="4" rx="2" fill="#b85f00"/>
    <text x="877" y="454" class="nodeTitle">Map + Localization</text>
    <text x="877" y="478" class="nodeText">warehouse occupancy map</text>
    <text x="877" y="499" class="nodeText">AMCL pose + TF</text>

    <rect x="1089" y="424" width="205" height="98" rx="8" class="node"/>
    <rect x="1089" y="424" width="205" height="4" rx="2" fill="#b85f00"/>
    <text x="1109" y="454" class="nodeTitle">Layered Costmaps</text>
    <text x="1109" y="478" class="nodeText">static + obstacle layers</text>
    <text x="1109" y="499" class="nodeText">local and global prediction</text>

    <rect x="1321" y="424" width="205" height="98" rx="8" class="node"/>
    <rect x="1321" y="424" width="205" height="4" rx="2" fill="#b85f00"/>
    <text x="1341" y="454" class="nodeTitle">Smac Hybrid-A*</text>
    <text x="1341" y="478" class="nodeText">kinematically feasible path</text>
    <text x="1341" y="499" class="nodeText">minimum-radius constraints</text>

    <rect x="857" y="588" width="205" height="98" rx="8" class="node"/>
    <rect x="857" y="588" width="205" height="4" rx="2" fill="#4959c7"/>
    <text x="877" y="618" class="nodeTitle">Motion Predictor</text>
    <text x="877" y="642" class="nodeText">forklift + AGV + worker</text>
    <text x="877" y="663" class="nodeText">short-horizon swept paths</text>

    <rect x="1089" y="588" width="205" height="98" rx="8" class="node"/>
    <rect x="1089" y="588" width="205" height="4" rx="2" fill="#b85f00"/>
    <text x="1109" y="618" class="nodeTitle">MPPI Controller</text>
    <text x="1109" y="642" class="nodeText">Ackermann motion model</text>
    <text x="1109" y="663" class="nodeText">trajectory sampling + critics</text>

    <rect x="1321" y="588" width="205" height="98" rx="8" class="node"/>
    <rect x="1321" y="588" width="205" height="4" rx="2" fill="#b85f00"/>
    <text x="1341" y="618" class="nodeTitle">Velocity Smoother</text>
    <text x="1341" y="642" class="nodeText">acceleration constraints</text>
    <text x="1341" y="663" class="nodeText">stable /cmd_vel_nav</text>
  </g>

  <path d="M 1062 473 L 1089 473" class="amberLine"/>
  <path d="M 1294 473 L 1321 473" class="amberLine"/>
  <path d="M 959 588 C 959 548 1191 560 1191 522" class="amberLine" stroke-dasharray="7 6"/>
  <text x="1075" y="550" class="flowLabel" text-anchor="middle" fill="#b85f00">predicted occupancy</text>
  <path d="M 1423 522 C 1423 556 1248 548 1228 588" class="amberLine"/>
  <path d="M 1191 522 L 1191 588" class="amberLine"/>
  <path d="M 1294 637 L 1321 637" class="amberLine"/>
  <path d="M 915 288 C 950 310 840 300 840 350 L 840 412 L 959 412 L 959 424" class="amberLine" stroke-dasharray="7 6"/>
  <text x="940" y="313" class="flowLabel" text-anchor="middle" fill="#b85f00">pose + sensors</text>

  <rect x="857" y="719" width="669" height="32" rx="8" fill="#fff3e3" stroke="#e2ba80"/>
  <text x="1191" y="740" class="small" text-anchor="middle" fill="#b85f00">AMCL &#8226; BEHAVIOR TREE &#8226; DYNAMIC COSTMAPS &#8226; HYBRID-A* &#8226; MPPI</text>

  <!-- Shared actuation -->
  <path d="M 741 473 L 760 473 L 760 790 L 692 790 L 692 820" class="cyanLine"/>
  <text x="748" y="707" class="flowLabel" text-anchor="end" fill="#087f8c">speed + steering</text>
  <path d="M 1423 686 L 1542 686 L 1542 790 L 908 790 L 908 820" class="amberLine"/>
  <text x="1320" y="783" class="flowLabel" text-anchor="middle" fill="#b85f00">smoothed velocity</text>

  <g filter="url(#shadow)">
    <rect x="530" y="820" width="540" height="80" rx="8" fill="#f0faf3" stroke="#7fbd93" stroke-width="2"/>
    <rect x="530" y="820" width="540" height="5" rx="2" fill="#16803a"/>
    <text x="800" y="852" class="nodeTitle" text-anchor="middle">ACKERMANN ACTUATION GATEWAY</text>
    <text x="800" y="878" class="nodeText" text-anchor="middle">command adapter &#8226; steering bounds &#8226; V550 Gazebo drive plugin</text>
  </g>
  <path d="M 800 820 L 800 288" class="greenLine" stroke-dasharray="9 7"/>
  <rect x="744" y="302" width="112" height="24" rx="8" fill="#ddf2e4" stroke="#8fc19f"/>
  <text x="800" y="318" class="small" text-anchor="middle" fill="#16803a">/cmd_vel</text>

  <g transform="translate(40 918)">
    <circle cx="5" cy="0" r="4" fill="#087f8c"/>
    <text x="17" y="4" class="small">learning path</text>
    <circle cx="132" cy="0" r="4" fill="#b85f00"/>
    <text x="144" y="4" class="small">Nav2 path</text>
    <circle cx="242" cy="0" r="4" fill="#16803a"/>
    <text x="254" y="4" class="small">shared platform</text>
    <text x="1520" y="4" class="small" text-anchor="end">ROS 2 Humble &#8226; Gazebo Classic &#8226; PyTorch</text>
  </g>
</svg>
