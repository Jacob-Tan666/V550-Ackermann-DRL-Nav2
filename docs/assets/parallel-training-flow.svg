<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">V550 multi-process TD3 training data flow</title>
  <desc id="desc">Isolated ROS 2 and Gazebo workers collect transitions for one learner, which trains TD3, broadcasts fresh actor weights, evaluates centrally, and saves checkpoints.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d6dee8" stroke-width="1" opacity="0.64"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16803a"/>
    </marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #10243e; letter-spacing: 0; }
      .subtitle { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #596b80; letter-spacing: 0; }
      .eyebrow { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .heading { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #182a42; letter-spacing: 0; }
      .nodeTitle { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #182a42; letter-spacing: 0; }
      .body { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #586b82; letter-spacing: 0; }
      .small { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5f7289; letter-spacing: 0; }
      .tiny { font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65788f; letter-spacing: 0; }
      .flow { fill: none; stroke: #087f8c; stroke-width: 2.5; marker-end: url(#arrowTeal); }
      .stats { fill: none; stroke: #7c3aed; stroke-width: 2.2; marker-end: url(#arrowPurple); }
      .weights { fill: none; stroke: #16803a; stroke-width: 2.5; marker-end: url(#arrowGreen); stroke-dasharray: 8 6; }
      .panel { fill: #ffffff; stroke: #c5d1dd; stroke-width: 1.5; }
      .node { fill: #f8fafc; stroke: #c5d1dd; stroke-width: 1.25; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#f3f6fa"/>
  <rect width="1440" height="760" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="758" rx="8" fill="none" stroke="#c5d1dd" stroke-width="2"/>

  <g transform="translate(40 31)">
    <rect x="0" y="2" width="5" height="62" rx="2" fill="#087f8c"/>
    <text x="23" y="29" class="title">MULTI-PROCESS TD3 TRAINING FLOW</text>
    <text x="23" y="54" class="subtitle">Parallel Gazebo sampling, centralized learning, weight synchronization, evaluation, and checkpoints</text>
  </g>
  <g transform="translate(1042 38)">
    <rect width="116" height="31" rx="8" fill="#e8f6f7" stroke="#9dcfd4"/>
    <text x="58" y="20" class="small" text-anchor="middle" fill="#087f8c">N WORKERS</text>
    <rect x="126" width="116" height="31" rx="8" fill="#eef0fb" stroke="#b6bce9"/>
    <text x="184" y="20" class="small" text-anchor="middle" fill="#4959c7">1 LEARNER</text>
    <rect x="252" width="116" height="31" rx="8" fill="#f0faf3" stroke="#93c5a3"/>
    <text x="310" y="20" class="small" text-anchor="middle" fill="#16803a">1 EVALUATOR</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="128" width="282" height="504" rx="8" class="panel"/>
    <rect x="40" y="128" width="282" height="5" rx="2" fill="#087f8c"/>
  </g>
  <text x="64" y="162" class="eyebrow" fill="#087f8c">ISOLATED SAMPLERS</text>
  <text x="64" y="190" class="heading">Gazebo + ROS 2 workers</text>

  <g>
    <rect x="64" y="214" width="234" height="108" rx="8" class="node"/>
    <rect x="64" y="214" width="6" height="108" rx="3" fill="#087f8c"/>
    <text x="84" y="242" class="nodeTitle">Worker 1</text>
    <text x="274" y="242" class="small" text-anchor="end" fill="#087f8c">DOMAIN 1</text>
    <text x="84" y="266" class="body">Gazebo world + V550 environment</text>
    <text x="84" y="288" class="body">inference-only actor + OU noise</text>
    <text x="84" y="308" class="tiny">reset • step • reward • episode summary</text>

    <rect x="64" y="338" width="234" height="108" rx="8" class="node"/>
    <rect x="64" y="338" width="6" height="108" rx="3" fill="#087f8c"/>
    <text x="84" y="366" class="nodeTitle">Worker 2</text>
    <text x="274" y="366" class="small" text-anchor="end" fill="#087f8c">DOMAIN 2</text>
    <text x="84" y="390" class="body">independent ROS graph and physics</text>
    <text x="84" y="412" class="body">local observation/action history</text>
    <text x="84" y="432" class="tiny">no optimizer • no writer • no checkpoint</text>

    <rect x="64" y="462" width="234" height="108" rx="8" class="node"/>
    <rect x="64" y="462" width="6" height="108" rx="3" fill="#087f8c"/>
    <text x="84" y="490" class="nodeTitle">Worker N</text>
    <text x="274" y="490" class="small" text-anchor="end" fill="#087f8c">DOMAIN N</text>
    <text x="84" y="514" class="body">parallel exploration and collection</text>
    <text x="84" y="536" class="body">shared global step budget</text>
    <text x="84" y="556" class="tiny">bounded transition queue backpressure</text>
  </g>

  <path d="M 298 268 L 368 268" class="flow"/>
  <path d="M 298 392 L 368 392" class="flow"/>
  <path d="M 298 516 L 368 516" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="368" y="178" width="190" height="402" rx="8" class="panel"/>
    <rect x="368" y="178" width="190" height="5" rx="2" fill="#7c3aed"/>
  </g>
  <text x="392" y="213" class="eyebrow" fill="#7c3aed">PROCESS IPC</text>
  <text x="392" y="241" class="heading">Queue boundary</text>
  <rect x="392" y="267" width="142" height="120" rx="8" fill="#e8f6f7" stroke="#9dcfd4"/>
  <text x="463" y="294" class="nodeTitle" text-anchor="middle">Transitions</text>
  <text x="463" y="320" class="small" text-anchor="middle">state • action • reward</text>
  <text x="463" y="341" class="small" text-anchor="middle">done • next state</text>
  <rect x="411" y="355" width="104" height="17" rx="4" fill="#ccebee"/>
  <rect x="417" y="349" width="104" height="17" rx="4" fill="#d8f0f2"/>
  <rect x="423" y="343" width="104" height="17" rx="4" fill="#e8f6f7" stroke="#9dcfd4"/>
  <rect x="392" y="413" width="142" height="110" rx="8" fill="#f2effd" stroke="#c5b5ed"/>
  <text x="463" y="441" class="nodeTitle" text-anchor="middle">Episode stats</text>
  <text x="463" y="467" class="small" text-anchor="middle">goal • collision • timeout</text>
  <text x="463" y="488" class="small" text-anchor="middle">return • step count</text>
  <text x="463" y="544" class="tiny" text-anchor="middle">spawn-safe multiprocessing</text>

  <path d="M 558 327 L 610 327" class="flow"/>
  <path d="M 558 468 C 585 468 585 606 610 606" class="stats"/>

  <g filter="url(#shadow)">
    <rect x="610" y="128" width="472" height="504" rx="8" class="panel"/>
    <rect x="610" y="128" width="472" height="5" rx="2" fill="#4959c7"/>
  </g>
  <text x="634" y="162" class="eyebrow" fill="#4959c7">CENTRAL LEARNER</text>
  <text x="634" y="190" class="heading">Replay, optimize, synchronize</text>

  <rect x="634" y="214" width="190" height="112" rx="8" class="node"/>
  <rect x="634" y="214" width="190" height="4" rx="2" fill="#7c3aed"/>
  <text x="729" y="244" class="nodeTitle" text-anchor="middle">Prioritized Replay</text>
  <text x="729" y="270" class="body" text-anchor="middle">TD-error priorities</text>
  <text x="729" y="292" class="body" text-anchor="middle">importance weights</text>
  <text x="729" y="312" class="tiny" text-anchor="middle">transition ownership</text>

  <rect x="850" y="214" width="208" height="112" rx="8" class="node"/>
  <rect x="850" y="214" width="208" height="4" rx="2" fill="#4959c7"/>
  <text x="954" y="244" class="nodeTitle" text-anchor="middle">Batch + Targets</text>
  <text x="954" y="270" class="body" text-anchor="middle">target policy smoothing</text>
  <text x="954" y="292" class="body" text-anchor="middle">min(Q1, Q2) bootstrap</text>
  <text x="954" y="312" class="tiny" text-anchor="middle">discounted Bellman target</text>

  <path d="M 824 270 L 850 270" class="flow"/>

  <rect x="634" y="354" width="190" height="116" rx="8" class="node"/>
  <rect x="634" y="354" width="190" height="4" rx="2" fill="#4959c7"/>
  <text x="729" y="384" class="nodeTitle" text-anchor="middle">Twin Critics</text>
  <text x="729" y="410" class="body" text-anchor="middle">weighted TD loss</text>
  <text x="729" y="432" class="body" text-anchor="middle">gradient clipping</text>
  <text x="729" y="452" class="tiny" text-anchor="middle">priority feedback to replay</text>

  <rect x="850" y="354" width="208" height="116" rx="8" class="node"/>
  <rect x="850" y="354" width="208" height="4" rx="2" fill="#087f8c"/>
  <text x="954" y="384" class="nodeTitle" text-anchor="middle">Delayed Actor Update</text>
  <text x="954" y="410" class="body" text-anchor="middle">maximize critic Q</text>
  <text x="954" y="432" class="body" text-anchor="middle">policy frequency = 2</text>
  <text x="954" y="452" class="tiny" text-anchor="middle">latest inference policy</text>

  <path d="M 954 326 L 954 354" class="flow"/>
  <path d="M 850 412 L 824 412" class="flow"/>
  <path d="M 729 354 L 729 326" class="stats"/>

  <rect x="634" y="498" width="424" height="76" rx="8" fill="#eef0fb" stroke="#b6bce9"/>
  <text x="846" y="526" class="nodeTitle" text-anchor="middle">Target Networks + Soft Update</text>
  <text x="846" y="550" class="body" text-anchor="middle">actor target • critic target • τ interpolation • resumable trainer state</text>
  <path d="M 729 470 L 729 498" class="flow"/>
  <path d="M 954 470 L 954 498" class="flow"/>

  <rect x="634" y="594" width="424" height="24" rx="7" fill="#f2effd" stroke="#c5b5ed"/>
  <text x="846" y="610" class="tiny" text-anchor="middle" fill="#7c3aed">TensorBoard status • replay health • collection and update throughput</text>

  <path d="M 1082 327 L 1120 327" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="1120" y="128" width="280" height="504" rx="8" class="panel"/>
    <rect x="1120" y="128" width="280" height="5" rx="2" fill="#16803a"/>
  </g>
  <text x="1144" y="162" class="eyebrow" fill="#16803a">CENTRAL EVALUATION</text>
  <text x="1144" y="190" class="heading">Select the best policy</text>
  <rect x="1144" y="214" width="232" height="92" rx="8" fill="#f0faf3" stroke="#93c5a3"/>
  <text x="1260" y="242" class="nodeTitle" text-anchor="middle">Evaluation Gazebo</text>
  <text x="1260" y="267" class="body" text-anchor="middle">fixed scenarios • deterministic actor</text>
  <text x="1260" y="287" class="small" text-anchor="middle" fill="#16803a">ROS DOMAIN 99</text>
  <rect x="1144" y="330" width="232" height="96" rx="8" class="node"/>
  <text x="1260" y="358" class="nodeTitle" text-anchor="middle">Evaluation metrics</text>
  <text x="1260" y="383" class="body" text-anchor="middle">goal rate • reward • collision rate</text>
  <text x="1260" y="404" class="body" text-anchor="middle">episode length • trajectories</text>
  <rect x="1144" y="450" width="232" height="86" rx="8" fill="#fff7ed" stroke="#e6bd84"/>
  <text x="1260" y="478" class="nodeTitle" text-anchor="middle">Best checkpoint</text>
  <text x="1260" y="503" class="body" text-anchor="middle">actor • critic • targets • trainer</text>
  <text x="1260" y="522" class="tiny" text-anchor="middle">resume metadata included</text>
  <rect x="1144" y="560" width="232" height="44" rx="8" fill="#eaf8ee" stroke="#93c5a3"/>
  <text x="1260" y="587" class="small" text-anchor="middle" fill="#16803a">CSV / JSON + TensorBoard</text>
  <path d="M 1260 306 L 1260 330" class="weights"/>
  <path d="M 1260 426 L 1260 450" class="weights"/>

  <path d="M 954 470 L 1092 470 L 1092 678 L 52 678 L 52 268 L 64 268" class="weights"/>
  <path d="M 52 516 L 64 516" class="weights"/>
  <path d="M 52 392 L 64 392" class="weights"/>
  <text x="620" y="697" class="small" text-anchor="middle" fill="#16803a">latest actor weights replace stale updates in each worker queue</text>
  <rect x="810" y="657" width="164" height="28" rx="8" fill="#ddf2e4" stroke="#93c5a3"/>
  <text x="892" y="675" class="tiny" text-anchor="middle" fill="#16803a">sync every 500 env steps</text>

  <text x="40" y="742" class="small">torch.multiprocessing spawn • isolated CUDA contexts • one replay owner • reproducible evaluation</text>
</svg>
