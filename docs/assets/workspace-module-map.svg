<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">V550 workspace module and dependency map</title>
  <desc id="desc">Four shell entry points connect the Python TD3 package, V550 description package, and Gazebo Nav2 package to ROS 2, PyTorch, Gazebo, Nav2, visualization tools, and generated artifacts.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d6dee8" stroke-width="1" opacity="0.64"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4959c7"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85f00"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16803a"/>
    </marker>
    <style>
      .title { font: 700 29px Inter, ui-sans-serif, system-ui, sans-serif; fill: #10243e; letter-spacing: 0; }
      .subtitle { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #596b80; letter-spacing: 0; }
      .eyebrow { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .heading { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #182a42; letter-spacing: 0; }
      .nodeTitle { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #182a42; letter-spacing: 0; }
      .body { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #586b82; letter-spacing: 0; }
      .small { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5f7289; letter-spacing: 0; }
      .tiny { font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65788f; letter-spacing: 0; }
      .label { font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; paint-order: stroke fill; stroke: #f3f6fa; stroke-width: 6px; }
      .entryFlow { fill: none; stroke: #4959c7; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .rosFlow { fill: none; stroke: #087f8c; stroke-width: 2.5; marker-end: url(#arrowTeal); }
      .assetFlow { fill: none; stroke: #b85f00; stroke-width: 2.4; marker-end: url(#arrowAmber); }
      .outputFlow { fill: none; stroke: #16803a; stroke-width: 2.3; marker-end: url(#arrowGreen); stroke-dasharray: 8 6; }
      .panel { fill: #ffffff; stroke: #c5d1dd; stroke-width: 1.5; }
      .node { fill: #f8fafc; stroke: #c5d1dd; stroke-width: 1.25; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#f3f6fa"/>
  <rect width="1440" height="820" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="818" rx="8" fill="none" stroke="#c5d1dd" stroke-width="2"/>

  <g transform="translate(40 31)">
    <rect x="0" y="2" width="5" height="62" rx="2" fill="#4959c7"/>
    <text x="23" y="29" class="title">WORKSPACE MODULE MAP</text>
    <text x="23" y="54" class="subtitle">Executable entry points, owned modules, ROS graph boundaries, platform dependencies, and generated artifacts</text>
  </g>
  <g transform="translate(1012 38)">
    <rect width="116" height="31" rx="8" fill="#eef0fb" stroke="#b6bce9"/>
    <text x="58" y="20" class="small" text-anchor="middle" fill="#4959c7">4 LAUNCHERS</text>
    <rect x="126" width="112" height="31" rx="8" fill="#e8f6f7" stroke="#9dcfd4"/>
    <text x="182" y="20" class="small" text-anchor="middle" fill="#087f8c">3 MODULES</text>
    <rect x="248" width="140" height="31" rx="8" fill="#f0faf3" stroke="#93c5a3"/>
    <text x="318" y="20" class="small" text-anchor="middle" fill="#16803a">1 WORKSPACE</text>
  </g>

  <text x="40" y="128" class="eyebrow" fill="#4959c7">USER-FACING ENTRY POINTS</text>
  <g filter="url(#shadow)">
    <rect x="40" y="146" width="300" height="112" rx="8" class="panel"/>
    <rect x="40" y="146" width="300" height="5" rx="2" fill="#087f8c"/>
    <rect x="390" y="146" width="300" height="112" rx="8" class="panel"/>
    <rect x="390" y="146" width="300" height="5" rx="2" fill="#7c3aed"/>
    <rect x="740" y="146" width="300" height="112" rx="8" class="panel"/>
    <rect x="740" y="146" width="300" height="5" rx="2" fill="#16803a"/>
    <rect x="1090" y="146" width="310" height="112" rx="8" class="panel"/>
    <rect x="1090" y="146" width="310" height="5" rx="2" fill="#b85f00"/>
  </g>
  <text x="64" y="180" class="nodeTitle">run_single_train.sh</text>
  <text x="64" y="204" class="body">one Gazebo environment + trainer</text>
  <text x="64" y="229" class="tiny">ROS Domain 1 &#8226; train_single.py</text>
  <text x="414" y="180" class="nodeTitle">run_multi_train.sh</text>
  <text x="414" y="204" class="body">N isolated samplers + one learner</text>
  <text x="414" y="229" class="tiny">Domains 1..N + evaluator 99</text>
  <text x="764" y="180" class="nodeTitle">run_td3_test.sh</text>
  <text x="764" y="204" class="body">deterministic checkpoint evaluation</text>
  <text x="764" y="229" class="tiny">test_td3.py &#8226; CSV / JSON</text>
  <text x="1114" y="180" class="nodeTitle">run_industrial_nav2.sh</text>
  <text x="1114" y="204" class="body">warehouse autonomy demonstration</text>
  <text x="1114" y="229" class="tiny">Gazebo + Nav2 + RViz</text>

  <!-- Entrypoint routing bus -->
  <path d="M 190 258 L 190 286 M 540 258 L 540 286 M 890 258 L 890 286 M 190 286 L 890 286" fill="none" stroke="#4959c7" stroke-width="2.4"/>
  <path d="M 300 286 L 300 334" class="entryFlow"/>
  <path d="M 1245 258 L 1245 334" class="assetFlow"/>
  <text x="584" y="299" class="label" text-anchor="middle" fill="#4959c7">Python training and evaluation entrypoints</text>

  <!-- Core modules -->
  <g filter="url(#shadow)">
    <rect x="40" y="334" width="520" height="316" rx="8" class="panel"/>
    <rect x="40" y="334" width="520" height="5" rx="2" fill="#087f8c"/>
    <rect x="610" y="334" width="260" height="316" rx="8" class="panel"/>
    <rect x="610" y="334" width="260" height="5" rx="2" fill="#16803a"/>
    <rect x="920" y="334" width="480" height="316" rx="8" class="panel"/>
    <rect x="920" y="334" width="480" height="5" rx="2" fill="#b85f00"/>
  </g>

  <text x="64" y="370" class="eyebrow" fill="#087f8c">PYTHON LEARNING PACKAGE</text>
  <text x="64" y="398" class="heading">drl_navigation_ros2</text>
  <rect x="64" y="424" width="224" height="82" rx="8" class="node"/>
  <text x="176" y="452" class="nodeTitle" text-anchor="middle">TD3 Core</text>
  <text x="176" y="476" class="body" text-anchor="middle">actor &#8226; twin critic &#8226; targets</text>
  <text x="176" y="495" class="tiny" text-anchor="middle">OU noise + checkpoint I/O</text>
  <rect x="312" y="424" width="224" height="82" rx="8" class="node"/>
  <text x="424" y="452" class="nodeTitle" text-anchor="middle">ROS Environment</text>
  <text x="424" y="476" class="body" text-anchor="middle">scan &#8226; odometry &#8226; reward</text>
  <text x="424" y="495" class="tiny" text-anchor="middle">reset + step + command publishing</text>
  <rect x="64" y="526" width="224" height="82" rx="8" fill="#f2effd" stroke="#c5b5ed"/>
  <text x="176" y="554" class="nodeTitle" text-anchor="middle">Replay + Trainers</text>
  <text x="176" y="578" class="body" text-anchor="middle">PER &#8226; single &#8226; multi-process</text>
  <text x="176" y="597" class="tiny" text-anchor="middle">central ownership and evaluation</text>
  <rect x="312" y="526" width="224" height="82" rx="8" fill="#eaf8ee" stroke="#93c5a3"/>
  <text x="424" y="554" class="nodeTitle" text-anchor="middle">Model Artifacts</text>
  <text x="424" y="578" class="body" text-anchor="middle">actor &#8226; critics &#8226; trainer state</text>
  <text x="424" y="597" class="tiny" text-anchor="middle">metrics + trajectory exports</text>

  <text x="634" y="370" class="eyebrow" fill="#16803a">ROBOT ASSETS</text>
  <text x="634" y="398" class="heading">V550 Description</text>
  <rect x="634" y="424" width="212" height="84" rx="8" class="node"/>
  <text x="740" y="452" class="nodeTitle" text-anchor="middle">URDF Variants</text>
  <text x="740" y="476" class="body" text-anchor="middle">training + industrial</text>
  <text x="740" y="496" class="tiny" text-anchor="middle">links &#8226; joints &#8226; sensors</text>
  <rect x="634" y="528" width="212" height="80" rx="8" class="node"/>
  <text x="740" y="556" class="nodeTitle" text-anchor="middle">Meshes + RViz</text>
  <text x="740" y="580" class="body" text-anchor="middle">visual and collision geometry</text>
  <text x="740" y="599" class="tiny" text-anchor="middle">robot_state_publisher input</text>

  <text x="944" y="370" class="eyebrow" fill="#b85f00">SIMULATION + AUTONOMY PACKAGE</text>
  <text x="944" y="398" class="heading">v550_ackermann_gazebo</text>
  <rect x="944" y="424" width="200" height="82" rx="8" class="node"/>
  <text x="1044" y="452" class="nodeTitle" text-anchor="middle">World + Models</text>
  <text x="1044" y="476" class="body" text-anchor="middle">warehouse &#8226; traffic &#8226; maps</text>
  <text x="1044" y="495" class="tiny" text-anchor="middle">V550 Gazebo drive plugin</text>
  <rect x="1172" y="424" width="204" height="82" rx="8" fill="#fff7ed" stroke="#e6bd84"/>
  <text x="1274" y="452" class="nodeTitle" text-anchor="middle">Nav2 Stack</text>
  <text x="1274" y="476" class="body" text-anchor="middle">AMCL &#8226; Smac &#8226; MPPI</text>
  <text x="1274" y="495" class="tiny" text-anchor="middle">costmaps + velocity smoother</text>
  <rect x="944" y="526" width="200" height="82" rx="8" class="node"/>
  <text x="1044" y="554" class="nodeTitle" text-anchor="middle">Launch System</text>
  <text x="1044" y="578" class="body" text-anchor="middle">DRL + industrial bringup</text>
  <text x="1044" y="597" class="tiny" text-anchor="middle">process lifecycle and readiness</text>
  <rect x="1172" y="526" width="204" height="82" rx="8" fill="#e8f6f7" stroke="#9dcfd4"/>
  <text x="1274" y="554" class="nodeTitle" text-anchor="middle">Runtime Adapters</text>
  <text x="1274" y="578" class="body" text-anchor="middle">dynamic prediction + cmd bridge</text>
  <text x="1274" y="597" class="tiny" text-anchor="middle">TF, trajectories, joint sanitation</text>

  <path d="M 560 470 L 590 470 L 590 626 L 920 626" class="rosFlow"/>
  <text x="745" y="618" class="label" text-anchor="middle" fill="#087f8c">ROS topics, services, TF</text>
  <path d="M 870 516 L 920 516" class="assetFlow"/>
  <text x="895" y="508" class="label" text-anchor="middle" fill="#b85f00">URDF + meshes</text>
  <path d="M 288 567 L 312 567" class="outputFlow"/>

  <!-- Platform foundation -->
  <rect x="40" y="700" width="1360" height="76" rx="8" fill="#ffffff" stroke="#c5d1dd" stroke-width="1.5"/>
  <text x="64" y="727" class="eyebrow" fill="#4959c7">PLATFORM FOUNDATION</text>
  <g>
    <rect x="240" y="716" width="150" height="42" rx="8" fill="#eef0fb" stroke="#b6bce9"/>
    <text x="315" y="742" class="small" text-anchor="middle" fill="#4959c7">ROS 2 HUMBLE</text>
    <rect x="410" y="716" width="150" height="42" rx="8" fill="#e8f6f7" stroke="#9dcfd4"/>
    <text x="485" y="742" class="small" text-anchor="middle" fill="#087f8c">PYTORCH</text>
    <rect x="580" y="716" width="170" height="42" rx="8" fill="#fff3e3" stroke="#e2ba80"/>
    <text x="665" y="742" class="small" text-anchor="middle" fill="#b85f00">GAZEBO CLASSIC</text>
    <rect x="770" y="716" width="150" height="42" rx="8" fill="#fff3e3" stroke="#e2ba80"/>
    <text x="845" y="742" class="small" text-anchor="middle" fill="#b85f00">NAV2</text>
    <rect x="940" y="716" width="190" height="42" rx="8" fill="#f0faf3" stroke="#93c5a3"/>
    <text x="1035" y="742" class="small" text-anchor="middle" fill="#16803a">RVIZ + TENSORBOARD</text>
    <rect x="1150" y="716" width="218" height="42" rx="8" fill="#f8fafc" stroke="#c5d1dd"/>
    <text x="1259" y="742" class="small" text-anchor="middle">COLCON + POETRY</text>
  </g>
  <path d="M 300 650 L 300 700" class="outputFlow"/>
  <path d="M 740 650 L 740 684 L 845 684 L 845 700" class="outputFlow"/>
  <path d="M 1160 650 L 1160 684 L 1035 684 L 1035 700" class="outputFlow"/>
</svg>
